services:
  # One-shot: populate ./vendor before Nextcloud starts. The repo does not
  # commit vendor/, and the app volume mounts it into the container, so
  # without this the app fails to autoload its dependencies.
  composer:
    image: docker.io/library/composer:2
    working_dir: /app
    volumes:
      - .:/app
    command: >-
      install --no-interaction --no-progress --ignore-platform-reqs

  db:
    image: docker.io/library/mariadb:10.11
    restart: unless-stopped
    command: >-
      --transaction-isolation=READ-COMMITTED
      --log-bin=binlog
      --binlog-format=ROW
      --innodb-read-only-compressed=OFF
    volumes:
      - db_data:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-nextcloud}
      MYSQL_USER: ${MYSQL_USER:-nextcloud}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-nextcloud}

  app:
    build:
      context: ./docker
      args:
        # Pinned to 33, not `stable`. `stable` now points at Nextcloud 34,
        # which the app declares itself incompatible with (max-version="33"
        # in app/appinfo/info.xml), so `occ app:enable` refuses to install.
        # Matches the default in .env.example; raise both together with the
        # info.xml max-version.
        NEXTCLOUD_IMAGE_TAG: ${NEXTCLOUD_IMAGE_TAG:-33}
    restart: unless-stopped
    ports:
      - "${NEXTCLOUD_PORT:-8080}:80"
    depends_on:
      db:
        condition: service_started
      composer:
        condition: service_completed_successfully
    volumes:
      - nextcloud_data:/var/www/html
      - ./app:/var/www/html/custom_apps/w3ds_login
      - ./vendor:/var/www/html/custom_apps/w3ds_login/vendor
      - ./docker/nextcloud-dev.config.php:/dev-config/nextcloud-dev.config.php:ro
      - ./docker/hooks/before-starting.sh:/docker-entrypoint-hooks.d/before-starting/dev-config.sh:ro
    environment:
      MYSQL_HOST: db
      MYSQL_DATABASE: ${MYSQL_DATABASE:-nextcloud}
      MYSQL_USER: ${MYSQL_USER:-nextcloud}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-nextcloud}
      NEXTCLOUD_ADMIN_USER: ${NEXTCLOUD_ADMIN_USER:-admin}
      NEXTCLOUD_ADMIN_PASSWORD: ${NEXTCLOUD_ADMIN_PASSWORD:-admin}
      NEXTCLOUD_TRUSTED_DOMAINS: localhost
      XDEBUG_MODE: ${XDEBUG_MODE:-off}
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  db_data:
  nextcloud_data:
